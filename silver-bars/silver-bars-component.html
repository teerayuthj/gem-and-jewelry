     - font Prompt ถูก @import ในไฟล์ CSS แล้ว ไม่ต้องใส่เพิ่ม
     - ค่าเริ่มต้น = โหมด mock (แสดง badge "ราคาตัวอย่าง")
     - ต่อ API จริงในอนาคต เลือกทางใดทางหนึ่ง:

       ก) ใส่ที่ตัว div เลย

       ข) หรือประกาศ config ก่อนโหลด script
          <script>
            window.SILVER_BARS_CONFIG = {
              apiUrl: 'https://api-price.ausiris.co.th/api/v1/prices/ausiris-silver',
              refreshMs: 30000
            };
          </script>

     - ปรับ mapping response ได้ที่ฟังก์ชัน mapApiResponse ใน silver-bars.js
