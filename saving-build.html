    <!-- Cookie Consent -->
    <link rel="stylesheet" type="text/css" href="https://cdn.wpcc.io/lib/1.0.2/cookieconsent.min.css" />
    <script src="https://cdn.wpcc.io/lib/1.0.2/cookieconsent.min.js" defer></script>
    <script>
        window.addEventListener("load", function () {
            if (typeof window.wpcc === 'undefined') return;
            window.wpcc.init({
                colors: {
                    popup: { background: "#222222", text: "#ffffff", border: "#f9f9f9" },
                    button: { background: "#f9f9f9", text: "#000000" }
                },
                transparency: "10",
                fontsize: "small",
                content: {
                    href: "http://www.ausiris.co.th/content/index/aboutus/cookies-policy.html",
                    message: "เว็บไซต์นี้มีการเก็บข้อมูลใช้คุกกี้ (Cookies) เพื่อการพัฒนาและปรับปรุงเว็บไซต์ หากท่านใช้บริการเว็บไซต์นี้โดยไม่มีการปรับตั้งค่าใดๆ แสดงว่าท่านยินยอมที่จะรับคุกกี้บนเว็บไซต์ และนโยบายสิทธิส่วนบุคคลของเรา",
                    link: "นโยบายการใช้คุกกี้",
                    button: "ให้ความยินยอม"
                },
                position: "bottom",
                padding: "small",
                margin: "small",
                corners: "small"
            });
        });
    </script>
