<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ออมทอง สร้างอนาคต | Gold Saving Calculator V3 - Goal First</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS Library -->
    <link rel="stylesheet" href="http://www.ausiris.co.th/etc/designs/ausiris-gold/css/style.css" />
    <link rel="stylesheet" href="http://www.ausiris.co.th/etc/designs/ausiris-gold/css/swiper.css" />
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.min.css" />
    <link rel="stylesheet" href="http://www.ausiris.co.th/etc/designs/ausiris-gold/css/bootstrap.min.css" />
    <link rel="stylesheet" href="http://www.ausiris.co.th/etc/designs/ausiris-gold/css/bootstrap-select.css" />

    <!-- JS Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/3.2.7/js/swiper.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/numeral.js/1.4.5/numeral.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.0/d3.min.js"></script>
    <script src="https://use.fontawesome.com/21df7b781f.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>
    <script src="http://www.ausiris.co.th/etc/designs/ausiris-gold/js/bootstrap-select.min.js"></script>
    <script src="http://www.ausiris.co.th/etc/designs/ausiris-gold/js/lodash.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- CSS Files -->
    <link rel="stylesheet" href="./assets/css/liquid-glass-cards.css" />
    <link rel="stylesheet" href="./assets/css/gold-saving3.css" />
</head>

<body data-ui-style="minimal">
    <!-- Navigation Back -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="page.html" class="nav-back">
                <i class="fas fa-arrow-left"></i>
                <span>กลับหน้าหลัก</span>
            </a>
            <div class="nav-logo">
                <img src="http://www.ausiris.co.th/content/dam/ausirisgold/brand/logo-ausiris-gold.svg"
                    alt="Ausiris Gold" onerror="this.style.display='none'" />
            </div>
            <!-- Language Switcher -->
            <div class="lang-switcher" id="langSwitcher">
                <button class="lang-btn3 active" data-lang="th">TH</button>
                <button class="lang-btn3" data-lang="en">EN</button>
                <button class="lang-btn3" data-lang="cn">CN</button>
            </div>
        </div>
    </nav>

    <!-- UI Style Switcher (สำหรับให้ทีมเลือก) -->
    <div class="style-switcher">
        <span class="style-label">เลือกรูปแบบ UI:</span>
        <button class="style-btn" data-style="luxury">
            <i class="fas fa-gem"></i> Luxury
        </button>
        <button class="style-btn active" data-style="minimal">
            <i class="fas fa-minus"></i> Minimal
        </button>
        <button class="style-btn" data-style="playful">
            <i class="fas fa-star"></i> Playful
        </button>
    </div>

    <!-- Gold Saving Calculator Section -->
    <section id="goldSavingSection3" class="main-section">
        <div id="gold-saving-app3">
            <!-- Calculator will be rendered here -->
            <div class="loading-container">
                <i class="fas fa-spinner fa-spin"></i>
                <p>กำลังโหลด...</p>
            </div>
        </div>
    </section>

    <!-- Compare Link -->
    <div class="compare-link">
        <a href="saving2.html">
            <i class="fas fa-exchange-alt"></i> ดู Version 2 (เลือกเงินออมก่อน)
        </a>
    </div>

    <!-- Scripts -->
    <script src="./assets/js/shared-price-manager.js"></script>
    <script src="./assets/js/gold-products.js"></script>
    <script src="./assets/js/gold-saving-calculator3.js"></script>

    <script>
        // Initialize Gold Saving Calculator 3
        let goldSavingCalc3;

        document.addEventListener("DOMContentLoaded", function () {
            goldSavingCalc3 = new GoldSavingCalculator3("gold-saving-app3");

            // Language Switcher
            const langBtns = document.querySelectorAll(".lang-btn3");
            langBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    langBtns.forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    goldSavingCalc3.setLanguage(btn.dataset.lang);
                });
            });

            // Style Switcher
            const styleBtns = document.querySelectorAll(".style-btn");
            styleBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    styleBtns.forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    const style = btn.dataset.style;
                    document.body.setAttribute('data-ui-style', style);
                    goldSavingCalc3.setUIStyle(style);
                });
            });

            // Set default style
            document.body.setAttribute('data-ui-style', 'minimal');
        });
    </script>
</body>

</html>
