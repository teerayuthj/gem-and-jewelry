<!DOCTYPE html>
<html>
<head>
    <title>Modal Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-button { 
            padding: 10px 20px; 
            background: #045b96; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin: 10px 0;
        }
        .test-button:hover { background: #002e65; }
        .results { 
            margin-top: 20px; 
            padding: 15px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Modal Functionality Test</h1>
    <p>This page tests the modal binding functionality.</p>
    
    <button class="test-button" onclick="testModalBinding()">Test Modal Binding</button>
    <button class="test-button" onclick="testVariantModal()">Test Variant Modal</button>
    
    <div class="results" id="testResults">
        Test results will appear here...
    </div>
    
    <!-- Mock products grid for testing -->
    <div id="productsGrid2" style="margin-top: 20px; padding: 15px; border: 1px solid #eee; border-radius: 5px;">
        <div class="hero-card">
            <button class="select-variant" data-weight="1 บาท" data-affordable="1">Test Hero Button</button>
        </div>
        <div class="supporting-card" data-weight="0.5 บาท" data-affordable="1">
            <div class="supporting-info">
                <p class="supporting-weight">0.5 บาท</p>
                <p class="supporting-price">10000</p>
            </div>
        </div>
    </div>
    
    <script>
        function testModalBinding() {
            const results = document.getElementById('testResults');
            results.innerHTML = 'Testing modal binding...<br>';
            
            try {
                // Test if we can find the elements
                const grid = document.getElementById('productsGrid2');
                if (!grid) {
                    results.innerHTML += '❌ Products grid not found<br>';
                    return;
                }
                
                const selectVariantBtns = grid.querySelectorAll('.select-variant');
                const supportingCards = grid.querySelectorAll('.supporting-card');
                
                results.innerHTML += `✅ Found ${selectVariantBtns.length} hero buttons<br>`;
                results.innerHTML += `✅ Found ${supportingCards.length} supporting cards<br>`;
                
                // Test event binding
                selectVariantBtns.forEach((btn, index) => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        results.innerHTML += `✅ Hero button ${index + 1} clicked!<br>`;
                        alert('Hero button clicked!');
                    });
                });
                
                supportingCards.forEach((card, index) => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.js-img-preview')) return;
                        results.innerHTML += `✅ Supporting card ${index + 1} clicked!<br>`;
                        alert('Supporting card clicked!');
                    });
                });
                
                results.innerHTML += '✅ Modal binding test completed successfully!<br>';
                
            } catch (error) {
                results.innerHTML += `❌ Error: ${error.message}<br>`;
                console.error('Modal binding test error:', error);
            }
        }
        
        function testVariantModal() {
            const results = document.getElementById('testResults');
            results.innerHTML += 'Testing variant modal creation...<br>';
            
            try {
                // Create a simple modal for testing
                const modal = document.createElement('div');
                modal.id = 'testVariantModal';
                modal.style.position = 'fixed';
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100%';
                modal.style.height = '100%';
                modal.style.background = 'rgba(0, 0, 0, 0.5)';
                modal.style.display = 'flex';
                modal.style.alignItems = 'center';
                modal.style.justifyContent = 'center';
                modal.style.zIndex = '9999';
                
                const modalContent = document.createElement('div');
                modalContent.style.background = 'white';
                modalContent.style.padding = '20px';
                modalContent.style.borderRadius = '10px';
                modalContent.style.maxWidth = '500px';
                modalContent.style.width = '90%';
                
                modalContent.innerHTML = `
                    <h2>Test Variant Modal</h2>
                    <p>This is a test modal to verify modal functionality.</p>
                    <button onclick="document.getElementById('testVariantModal').remove()" style="
                        padding: 10px 20px; 
                        background: #045b96; 
                        color: white; 
                        border: none; 
                        border-radius: 5px; 
                        cursor: pointer;
                    ">Close Modal</button>
                `;
                
                modal.appendChild(modalContent);
                document.body.appendChild(modal);
                
                results.innerHTML += '✅ Test variant modal created successfully!<br>';
                
            } catch (error) {
                results.innerHTML += `❌ Error creating test modal: ${error.message}<br>`;
                console.error('Test modal error:', error);
            }
        }
    </script>
</body>
</html>
