    <script>window.addEventListener("load", function () { window.wpcc.init({ "colors": { "popup": { "background": "#222222", "text": "#ffffff", "border": "#f9f9f9" }, "button": { "background": "#f9f9f9", "text": "#000000" } }, "transparency": "10", "fontsize": "small", "content": { "href": "http://www.ausiris.co.th/content/index/aboutus/cookies-policy.html", "message": "เว็บไซต์นี้มีการเก็บข้อมูลใช้คุกกี้ (Cookies) เพื่อการพัฒนาและปรับปรุงเว็บไซต์ หากท่านใช้บริการเว็บไซต์นี้โดยไม่มีการปรับตั้งค่าใดๆ แสดงว่าท่านยินยอมที่จะรับคุกกี้บนเว็บไซต์ และนโยบายสิทธิส่วนบุคคลของเรา", "link": "นโยบายการใช้คุกกี้", "button": "ให้ความยินยอม" }, "position": "bottom", "padding": "small", "margin": "small", "corners": "small" }) });</script>

    <!-- Google Fonts -->

    <!-- CSS Files -->
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/gold-saving.css">

</head>

<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh;">

    <!-- Navigation Back -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <a href="page.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 transition">
                    <i class="fas fa-arrow-left"></i>
                    <span>กลับหน้าหลัก</span>
                </a>
                <div class="flex items-center gap-2">
                    <img src="http://www.ausiris.co.th/content/dam/ausirisgold/brand/logo-ausiris-gold.svg"
                        alt="Ausiris Gold" class="h-8" onerror="this.style.display='none'">
                </div>
                <!-- Language Switcher -->
                <div class="flex gap-2" id="langSwitcher">
                    <button class="lang-btn active" data-lang="th">TH</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="cn">CN</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Gold Saving Calculator Section -->
    <section id="goldSavingSection" class="py-8">
        <div id="gold-saving-app">
            <!-- Calculator will be rendered here -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-8">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm text-gray-400">
                &copy; 2025 Ausiris Gold. All rights reserved.
            </p>
            <p class="text-xs text-gray-500 mt-2">
                ราคาทองอ้างอิงจากราคาตลาด อาจมีการเปลี่ยนแปลงได้
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./assets/js/shared-price-manager.js"></script>
    <script src="./assets/js/gold-products.js"></script>
    <script src="./assets/js/gold-saving-calculator.js"></script>

    <script>
        // Initialize Gold Saving Calculator
        let goldSavingCalc;

        document.addEventListener('DOMContentLoaded', function () {
            goldSavingCalc = new GoldSavingCalculator('gold-saving-app');

            // Language Switcher
            const langBtns = document.querySelectorAll('.lang-btn');
            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    langBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    goldSavingCalc.setLanguage(btn.dataset.lang);
                });
            });
        });
    </script>

    <style>
        /* Language Switcher Styles */
        .lang-btn {
            padding: 0.4rem 0.8rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            font-size: 0.8rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            border-color: #d4af37;
            color: white;
        }

        /* Responsive Styles for iPad and Mobile */
        @media (max-width: 1024px) {

            /* iPad Portrait & Landscape */
            nav .flex {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }

        @media (max-width: 768px) {

            /* iPad Mini & Small Tablets */
            nav .max-w-6xl {
                padding: 0.75rem;
            }

            nav .flex {
                flex-direction: row;
                justify-content: space-between;
            }

            #langSwitcher {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 0.5rem;
            }

            .lang-btn {
                padding: 0.35rem 0.7rem;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {

            /* Mobile Phones */
            nav .flex>a span {
                display: none;
            }

            nav .flex>a {
                font-size: 1.2rem;
            }

            #goldSavingSection {
                padding: 1rem 0;
            }

            footer {
                padding: 1rem;
            }
        }
    </style>
</body>

</html>
