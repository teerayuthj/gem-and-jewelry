         JS Files for Gold Saving Calculator 2

    <!-- Modern Luxury Effects -->
    <script src="./assets/js/calculator/gold-saving2/modern-luxury-effects.js"></script>

    <script>
        // Initialize Gold Saving Calculator 2
        let goldSavingCalc2;
        let modernLuxuryEffects;

        document.addEventListener("DOMContentLoaded", function () {
            goldSavingCalc2 = new GoldSavingCalculator2("gold-saving-app2");

            // Initialize Modern Luxury Effects
            if (typeof ModernLuxuryEffects !== 'undefined') {
                modernLuxuryEffects = new ModernLuxuryEffects();

                // Trigger celebration when affordable card appears
                const observeAffordableCards = () => {
                    const grid = document.getElementById('productsGrid2');
                    if (!grid) return;

                    const observer = new MutationObserver(() => {
                        const affordableCards = grid.querySelectorAll('.supporting-card.affordable');
                        if (affordableCards.length > 0) {
                            // Check if this is a new affordable card (user just reached goal)
                            const wasNotAffordable = grid.dataset.hadNoAffordable === 'true';
                            if (wasNotAffordable) {
                                modernLuxuryEffects.triggerCelebration();
                                grid.dataset.hadNoAffordable = 'false';
                            }
                        } else {
                            grid.dataset.hadNoAffordable = 'true';
                        }
                    });

                    observer.observe(grid, { childList: true, subtree: true });
                };

                // Start observing after a short delay
                setTimeout(observeAffordableCards, 1000);
            }

            // Language Switcher
            const langBtns = document.querySelectorAll(".lang-btn2");
            langBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    langBtns.forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    goldSavingCalc2.setLanguage(btn.dataset.lang);

                    // Refresh counters when language changes
                    if (modernLuxuryEffects) {
                        setTimeout(() => modernLuxuryEffects.refreshCounters(), 100);
                    }
                });
            });

            // Expose modernLuxuryEffects to window for external access
            window.modernLuxuryEffects = modernLuxuryEffects;
        });

        // Expose celebration function for manual triggering
        function triggerGoalCelebration() {
            if (modernLuxuryEffects) {
                modernLuxuryEffects.triggerCelebration();
            }
        }

        // ============================================
        // ENHANCED IMAGE VIEWER MODAL
        // สำหรับดูรูปภาพสินค้าขนาดใหญ่แบบสวยหรู
        // ============================================

        // ฟังก์ชันเปิด Image Viewer Modal (Enhanced Style)
        function openEnhancedImageViewer(imgSrc, title, price) {
            // สร้าง modal
            const modal = document.createElement('div');
            modal.className = 'image-viewer-modal enhanced-modal';

            modal.innerHTML = `
                <div class="image-viewer-backdrop"></div>
                <div class="image-viewer-content">
                    <div class="image-viewer-image-wrapper">
                        <img class="image-viewer-image" src="${imgSrc}" alt="${title}" onerror="this.src='https://via.placeholder.com/800x600/045b96/ffffff?text=Gold+Bar'">
                        <button class="image-viewer-close"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="image-viewer-info">
                        <span><span class="info-icon"><i class="fas fa-cube"></i></span> ${title}</span>
                        ${price ? `<span><span class="info-icon"><i class="fas fa-coins"></i></span> ${price}</span>` : ''}
                        <a href="https://www.ausirisgold.com/content/index/gold-product/all.html" target="_blank" class="buy-now-btn">
                            <span class="btn-icon"><i class="fas fa-shopping-cart"></i></span>
                            <span class="btn-text">ซื้อเลย</span>
                        </a>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            // ป้องกันการ scroll ของ body
            document.body.style.overflow = 'hidden';

            // Trigger animation
            requestAnimationFrame(() => {
                modal.classList.add('active');
            });

            // จัดการปุ่มปิดและ backdrop
            const closeBtn = modal.querySelector('.image-viewer-close');
            const backdrop = modal.querySelector('.image-viewer-backdrop');
            const image = modal.querySelector('.image-viewer-image');

            closeBtn.addEventListener('click', closeEnhancedImageViewer);
            backdrop.addEventListener('click', closeEnhancedImageViewer);

            // ฟังก์ชันซูมรูป
            let isZoomed = false;
            image.addEventListener('click', (e) => {
                e.stopPropagation();
                isZoomed = !isZoomed;
                image.classList.toggle('zoomed', isZoomed);
                modal.classList.toggle('zoomed', isZoomed);
            });

            // ฟังก์ชันปิด modal
            function closeEnhancedImageViewer() {
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.remove();
                    document.body.style.overflow = '';
                }, 400);
            }
        }

        // เพิ่ม event listener สำหรับรูปภาพสินค้าหลังจาก DOM โหลดเสร็จ
        document.addEventListener('DOMContentLoaded', function() {
            const imageSelector = '#productsGrid2 .hero-card img, #productsGrid2 .supporting-card img';

            const attachImageViewer = function(img) {
                if (!img || img.dataset.imageViewerAttached) return;

                // เพิ่ม cursor pointer
                img.style.cursor = 'pointer';
                img.title = 'คลิกเพื่อดูรูปขนาดใหญ่';
                img.dataset.imageViewerAttached = 'true';

                img.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    // หาข้อมูลสินค้าจาก card
                    const card = this.closest('.hero-card, .supporting-card');
                    const title = card.querySelector('.product-name, .card-title, h3, h4')?.textContent || 'ทองคำแท่ง';
                    const price = card.querySelector('.product-price, .card-price, .price')?.textContent || '';

                    // เปิด modal
                    openEnhancedImageViewer(this.src, title, price);
                });
            };

            const processNode = function(node) {
                if (!node || node.nodeType !== 1) return;

                if (node.matches && node.matches(imageSelector)) {
                    attachImageViewer(node);
                }

                const images = node.querySelectorAll ? node.querySelectorAll(imageSelector) : [];
                images.forEach(attachImageViewer);
            };

            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(processNode);
                });
            });

            // เริ่ม observe productsGrid2
            const productsGrid = document.getElementById('productsGrid2');
            if (productsGrid) {
                productsGrid.querySelectorAll(imageSelector).forEach(attachImageViewer);
                observer.observe(productsGrid, { childList: true, subtree: true });
            }
        });

        // ปิด modal เมื่อกด ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.querySelector('.image-viewer-modal');
                if (modal) {
                    modal.classList.remove('active');
                    setTimeout(() => {
                        modal.remove();
                        document.body.style.overflow = '';
                    }, 400);
                }
            }
        });
    </script>
