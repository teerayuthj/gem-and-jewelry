<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประกาศราคาออมทองออสสิริส — Mock A / B / C (mobile)</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====== ประกาศราคาออมทอง (gold saving daily) — mock A/B/C ในไฟล์เดียว ======
   prefix .gsd- ทุกคลาส กันชนกับหน้า host ของ AEM
   ข้อมูลสดจาก https://api-price.ausiris.co.th/api/v1/gold-saving (+ /monthly)
   ถ้าเน็ตไม่ถึง API จะ fallback เป็น snapshot จริงของ 18 ก.ย. 2569
   ออกแบบ mobile-first: ทุก variant ทดสอบที่ 390px
*/
* { box-sizing: border-box; }
body {
    margin: 0; background: #eef2f7; color: #1e293b;
    font-family: 'Prompt', -apple-system, sans-serif; font-size: 16px; line-height: 1.5;
}

/* ---------- เปลือกของ mock (ไม่ใช่ส่วนของ component) ---------- */
.gsd-shellbar {
    position: sticky; top: 0; z-index: 40; background: rgba(238,242,247,.94);
    backdrop-filter: blur(8px); border-bottom: 1px solid #d8e0ea;
    padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
}
.gsd-shellbar .gsd-group { display: flex; gap: 6px; align-items: center; }
.gsd-shellbar label { font-size: .72rem; color: #64748b; font-weight: 500; }
.gsd-shellbar button, .gsd-shellbar select {
    font-family: inherit; font-size: .82rem; cursor: pointer; border: 1px solid #cbd5e1;
    background: #fff; color: #475569; padding: 7px 13px; border-radius: 999px; transition: .15s;
}
.gsd-shellbar button b { color: #0f2f56; }
.gsd-shellbar button.gsd-on { background: #0f2f56; border-color: #0f2f56; color: #fff; }
.gsd-shellbar button.gsd-on b { color: #f2a900; }
.gsd-stage { padding: 18px 12px 48px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.gsd-frame {
    width: 100%; max-width: 390px; background: #f6f8fb; border: 1px solid #d8e0ea;
    border-radius: 22px; box-shadow: 0 18px 40px rgba(15,47,86,.13); overflow: hidden;
}
.gsd-frame.gsd-wide { max-width: 760px; }
.gsd-caption { font-size: .78rem; color: #64748b; text-align: center; max-width: 620px; }
.gsd-debug { width: 100%; max-width: 620px; font-size: .74rem; color: #475569; }
.gsd-debug summary { cursor: pointer; color: #0f2f56; font-weight: 500; }
.gsd-debug pre {
    background: #0f2f56; color: #d7e3f4; padding: 12px; border-radius: 10px;
    overflow: auto; font-size: .72rem; line-height: 1.55;
}

/* ================= design tokens ของ component ================= */
.gsd {
    --navy: #0f2f56;
    --navy-soft: #1c4a80;
    --gold: #f2a900;
    --gold-soft: #fff7e6;
    --red: #c8102e;
    --red-soft: #fdeef1;
    --green: #00924c;
    --green-soft: #e8f7ef;
    --ink: #17253a;
    --muted: #6b7a90;
    --line: #e3e9f1;
    --card: #ffffff;
    --amber-ink: #8a5a00;
    --amber-bg: #fff4d9;
    font-family: 'Prompt', sans-serif; color: var(--ink);
    background: #f6f8fb; padding: 14px 13px 20px; display: block;
}
.gsd * { box-sizing: border-box; }
.gsd-num { font-variant-numeric: tabular-nums; }

/* ---------- แถบสถานะ (ใช้ทั้ง 3 แบบ) ---------- */
.gsd-status {
    display: flex; gap: 9px; align-items: flex-start; border-radius: 13px;
    padding: 10px 12px; font-size: .79rem; line-height: 1.45; margin-bottom: 12px;
    border: 1px solid transparent;
}
.gsd-status .gsd-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; margin-top: 6px; }
.gsd-status b { display: block; font-size: .84rem; font-weight: 600; }
.gsd-status.gsd-t-ok    { background: var(--green-soft); border-color: #b8e6cd; color: #07603a; }
.gsd-status.gsd-t-ok    .gsd-dot { background: var(--green); }
.gsd-status.gsd-t-warn  { background: var(--amber-bg); border-color: #f4dda4; color: var(--amber-ink); }
.gsd-status.gsd-t-warn  .gsd-dot { background: var(--gold); }
.gsd-status.gsd-t-bad   { background: var(--red-soft); border-color: #f3c2cc; color: #8c0a20; }
.gsd-status.gsd-t-bad   .gsd-dot { background: var(--red); }
.gsd-status.gsd-t-muted { background: #eef1f6; border-color: #dbe2ec; color: #4b5b70; }
.gsd-status.gsd-t-muted .gsd-dot { background: #94a3b8; }

/* =====================================================================
   VARIANT A — "ประกาศ" (พอร์ตจากรูปต้นแบบ ปรับเป็น mobile)
   ===================================================================== */
.gsd-a-head { text-align: center; margin-bottom: 13px; }
.gsd-a-head h2 {
    margin: 0; font-size: 1.05rem; font-weight: 600; line-height: 1.4; color: var(--navy);
}
.gsd-a-head .gsd-a-at { color: var(--navy); font-weight: 700; }
.gsd-a-head p { margin: 3px 0 0; font-size: .85rem; color: var(--muted); }
.gsd-a-head .gsd-today {
    display: inline-block; margin-top: 4px; padding: 2px 9px; border-radius: 999px;
    background: #eef1f6; border: 1px solid #dbe2ec; font-size: .7rem; color: #4b5b70;
}

.gsd-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.gsd-pcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: 0 2px 8px rgba(15,47,86,.05);
}
.gsd-pcard-cap {
    padding: 7px 11px; font-size: .85rem; font-weight: 600; color: #fff;
    display: flex; align-items: baseline; gap: 5px;
}
.gsd-pcard-cap small { font-size: .68rem; font-weight: 400; opacity: .9; }
.gsd-pcard.gsd-buy  .gsd-pcard-cap { background: var(--red); }
.gsd-pcard.gsd-sell .gsd-pcard-cap { background: var(--green); }
.gsd-pcard-body { padding: 11px; display: flex; align-items: baseline; justify-content: space-between; }
.gsd-pcard-val { font-size: 1.5rem; font-weight: 700; color: var(--navy); letter-spacing: -.5px; }
.gsd-pcard-unit { font-size: .68rem; color: var(--muted); }

.gsd-table { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.gsd-table table { width: 100%; border-collapse: collapse; }
.gsd-table th {
    font-size: .67rem; font-weight: 500; color: var(--muted); text-align: right;
    padding: 9px 10px 7px; border-bottom: 1px solid var(--line); line-height: 1.25;
}
.gsd-table th:first-child { text-align: left; }
.gsd-table td { padding: 9px 10px; border-bottom: 1px solid #f1f4f9; text-align: right; font-size: .86rem; }
.gsd-table tr:last-child td { border-bottom: none; }
.gsd-table td:first-child { text-align: left; font-weight: 600; color: var(--navy); }
.gsd-table .gsd-g { color: var(--navy); font-weight: 600; }
.gsd-table .gsd-sub { display: block; font-size: .66rem; color: var(--muted); font-weight: 400; }
.gsd-table .gsd-off { color: #9aa7b8; font-weight: 400; }
.gsd-table .gsd-user-row td {
    background: var(--gold-soft); border-top: 2px solid var(--gold); font-weight: 600;
}
.gsd-table .gsd-user-row td:first-child { color: var(--navy); }
.gsd-table .gsd-user-row .gsd-you {
    display: inline-block; margin-bottom: 2px; padding: 1px 6px; border-radius: 999px;
    background: var(--gold); color: #3d2a00; font-size: .62rem; font-weight: 600;
}
.gsd-foot-note { font-size: .72rem; color: var(--muted); text-align: center; margin: 9px 2px 14px; }
.gsd-stale {
    margin: -4px 0 12px; padding: 7px 10px; border-radius: 10px; font-size: .73rem;
    background: #eef1f6; border: 1px dashed #cbd5e1; color: #4b5b70; text-align: center;
}

.gsd-custom {
    border: 1.5px solid var(--gold); background: var(--gold-soft);
    border-radius: 15px; padding: 12px; margin-bottom: 12px; }
.gsd-custom h3 {
    margin: 0 0 9px; font-size: .88rem; font-weight: 600; color: var(--navy); text-align: center;
}
.gsd-inputrow {
    display: flex; align-items: center; gap: 9px; background: #fff;
    border: 1px solid #f0dcae; border-radius: 12px; padding: 9px 11px;
}
.gsd-inputrow span { font-size: .8rem; color: var(--muted); flex: 1 1 auto; min-width: 0; }
.gsd-inputrow input {
    flex: 0 1 132px; min-width: 0; width: 132px;
    font-family: inherit; font-size: clamp(1rem, 4.8vw, 1.15rem); font-weight: 700; color: var(--navy);
    text-align: right; border: 1px solid #e3e9f1; border-radius: 9px;
    padding: 5px 9px; background: #fff; font-variant-numeric: tabular-nums;
}
.gsd-inputrow input:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
.gsd-inputrow em { flex: 0 0 auto; font-size: .72rem; color: var(--muted); font-style: normal; white-space: nowrap; }
.gsd-custom-help { margin: 8px 2px 0; text-align: center; font-size: .69rem; color: var(--muted); }
.gsd-chips { display: flex; gap: 6px; margin-top: 9px; }
.gsd-chips button {
    flex: 1; font-family: inherit; font-size: .76rem; padding: 6px 0; border-radius: 999px;
    border: 1px solid #ecd9ad; background: #fff; color: var(--navy); cursor: pointer;
}
.gsd-chips button.gsd-on { background: var(--navy); border-color: var(--navy); color: #fff; }
.gsd-statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; margin-top: 11px; }
.gsd-statgrid div { background: #fff; padding: 9px 10px; }
.gsd-statgrid dt { font-size: .68rem; color: var(--muted); margin: 0 0 2px; }
.gsd-statgrid dd { margin: 0; font-size: .97rem; font-weight: 600; color: var(--navy); }
.gsd-statgrid dd small { font-size: .66rem; font-weight: 400; color: var(--muted); margin-left: 3px; }

@media (max-width: 360px) {
    .gsd-inputrow { gap: 6px; padding: 8px; }
    .gsd-inputrow span { font-size: .72rem; }
    .gsd-inputrow input { flex-basis: 122px; width: 122px; padding-inline: 6px; font-size: .86rem; }
    .gsd-inputrow em { font-size: .65rem; }
    .gsd-table th { padding: 8px 5px 6px; font-size: .61rem; }
    .gsd-table td { padding: 8px 5px; font-size: .76rem; }
    .gsd-table .gsd-g, .gsd-table .gsd-user-row .gsd-g { font-size: .73rem; }
    .gsd-table .gsd-user-row td { font-size: .73rem; }
}

/* =====================================================================
   VARIANT B — "คำนวณก่อน" (input เป็นพระเอก + ความคืบหน้าเดือนนี้)
   ===================================================================== */
.gsd-b-hero {
    background: linear-gradient(145deg, var(--navy), var(--navy-soft));
    border-radius: 18px; padding: 15px; color: #fff; margin-bottom: 11px;
}
.gsd-b-hero .gsd-b-kicker { font-size: .72rem; opacity: .8; }
.gsd-b-hero h2 { margin: 1px 0 11px; font-size: 1.02rem; font-weight: 600; }
.gsd-b-inputwrap {
    display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.22); border-radius: 13px; padding: 8px 10px;
}
.gsd-b-inputwrap input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 1.5rem; font-weight: 700; color: #fff;
    background: transparent; border: none; text-align: right; font-variant-numeric: tabular-nums;
}
.gsd-b-inputwrap input:focus { outline: none; }
.gsd-b-inputwrap label { font-size: .72rem; opacity: .85; }
.gsd-b-inputwrap em { font-size: .74rem; opacity: .85; font-style: normal; }
.gsd-b-chips { display: flex; gap: 6px; margin-top: 9px; }
.gsd-b-chips button {
    flex: 1; font-family: inherit; font-size: .76rem; padding: 6px 0; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: #fff;
}
.gsd-b-chips button.gsd-on { background: var(--gold); border-color: var(--gold); color: #3d2a00; font-weight: 600; }

.gsd-b-result {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    margin-bottom: 11px; box-shadow: 0 3px 10px rgba(15,47,86,.05);
}
.gsd-b-result .gsd-b-rlabel { font-size: .76rem; color: var(--muted); }
.gsd-b-big {
    font-size: 2.05rem; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -1px;
}
.gsd-b-big small { font-size: .38em; font-weight: 500; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
.gsd-b-big.gsd-off { color: #9aa7b8; }
.gsd-b-split { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 11px; overflow: hidden; margin-top: 11px; }
.gsd-b-split div { background: #fff; padding: 8px 10px; }
.gsd-b-split dt { font-size: .67rem; color: var(--muted); margin: 0 0 1px; }
.gsd-b-split dd { margin: 0; font-size: .92rem; font-weight: 600; color: var(--ink); }

.gsd-b-month { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px; margin-bottom: 11px; }
.gsd-b-month h3 { margin: 0 0 9px; font-size: .84rem; font-weight: 600; color: var(--navy); display: flex; justify-content: space-between; }
.gsd-b-month h3 span { font-size: .74rem; color: var(--muted); font-weight: 400; }
.gsd-bar { height: 8px; border-radius: 99px; background: #eef1f6; overflow: hidden; display: flex; }
.gsd-bar i { display: block; height: 100%; }
.gsd-bar .gsd-bar-done { background: var(--green); }
.gsd-bar .gsd-bar-miss { background: #f3c2cc; }
.gsd-b-legend { display: flex; gap: 12px; font-size: .68rem; color: var(--muted); margin-top: 7px; flex-wrap: wrap; }
.gsd-b-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.gsd-b-rows { margin-top: 10px; border-top: 1px solid var(--line); }
.gsd-b-rows div { display: flex; justify-content: space-between; padding: 6px 0; font-size: .8rem; border-bottom: 1px solid #f4f6fa; }
.gsd-b-rows div:last-child { border-bottom: none; }
.gsd-b-rows span { color: var(--muted); }
.gsd-b-rows b { color: var(--navy); font-weight: 600; }

.gsd-b-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 11px; }
.gsd-b-price { background: #fff; border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; padding: 9px 11px; }
.gsd-b-price.gsd-buy  { border-left-color: var(--red); }
.gsd-b-price.gsd-sell { border-left-color: var(--green); }
.gsd-b-price dt { font-size: .7rem; color: var(--muted); }
.gsd-b-price dd { margin: 1px 0 0; font-size: 1.14rem; font-weight: 700; color: var(--navy); }

.gsd-acc { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.gsd-acc > summary {
    list-style: none; cursor: pointer; padding: 11px 13px; font-size: .83rem;
    font-weight: 600; color: var(--navy); display: flex; justify-content: space-between; align-items: center;
}
.gsd-acc > summary::-webkit-details-marker { display: none; }
.gsd-acc > summary::after { content: '⌄'; font-size: 1.1rem; color: var(--muted); line-height: 1; }
.gsd-acc[open] > summary::after { content: '⌃'; }
.gsd-acc .gsd-acc-body { border-top: 1px solid var(--line); }

/* =====================================================================
   VARIANT C — "การ์ดประกาศ" (สไตล์ภาพโซเชียล แชร์ได้)
   ===================================================================== */
.gsd-c-card {
    position: relative; overflow: hidden; border-radius: 20px; padding: 16px 14px 14px;
    background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 26px rgba(15,47,86,.1);
}
.gsd-c-card::before, .gsd-c-card::after {
    content: ''; position: absolute; border-radius: 50%; z-index: 0;
}
.gsd-c-card::before { width: 130px; height: 130px; background: #eaf1fb; top: -52px; left: -46px; }
.gsd-c-card::after  { width: 96px; height: 96px; border: 14px solid #fdf0d4; bottom: -40px; right: -34px; }
.gsd-c-inner { position: relative; z-index: 1; }
.gsd-c-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.gsd-c-title { margin: 0; font-size: 1.62rem; font-weight: 700; color: var(--navy); line-height: 1.1; letter-spacing: -.6px; }
.gsd-c-title em { color: var(--gold); font-style: normal; }
.gsd-c-date { font-size: .74rem; color: var(--muted); margin-top: 3px; }
.gsd-c-brand { text-align: right; flex: 0 0 auto; }
.gsd-c-brand b { display: block; font-size: 1.05rem; font-weight: 700; color: var(--navy); letter-spacing: 2px; line-height: 1; }
.gsd-c-brand small { font-size: .56rem; color: var(--muted); letter-spacing: 1.4px; }

.gsd-c-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 13px 0 11px; }
.gsd-c-tile { border-radius: 14px; overflow: hidden; text-align: center; box-shadow: 0 2px 8px rgba(15,47,86,.07); }
.gsd-c-tile .gsd-c-cap { padding: 5px; font-size: .88rem; font-weight: 600; color: #fff; }
.gsd-c-tile .gsd-c-cap small { font-size: .64rem; font-weight: 400; opacity: .92; }
.gsd-c-tile.gsd-buy  .gsd-c-cap { background: var(--red); }
.gsd-c-tile.gsd-sell .gsd-c-cap { background: var(--green); }
.gsd-c-tile .gsd-c-val { background: #fff; padding: 9px 4px; font-size: 1.56rem; font-weight: 700; color: var(--navy); letter-spacing: -1px; }

.gsd-c-plan { display: flex; gap: 10px; align-items: flex-start; }
.gsd-c-planbox { flex: 1 1 auto; min-width: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.gsd-c-planbox .gsd-c-ph { display: grid; grid-template-columns: 1fr 1fr; }
.gsd-c-planbox .gsd-c-ph b { padding: 6px 9px; font-size: .74rem; font-weight: 600; color: #fff; background: var(--navy); }
.gsd-c-planbox .gsd-c-ph b + b { background: var(--gold); color: #3d2a00; text-align: right; }
.gsd-c-planbox .gsd-c-pr { display: grid; grid-template-columns: 1fr 1fr; background: #fff; }
.gsd-c-planbox .gsd-c-pr > span { padding: 7px 9px; font-size: .82rem; border-top: 1px solid #f1f4f9; }
.gsd-c-planbox .gsd-c-pr > span:first-child { font-weight: 600; color: var(--navy); }
.gsd-c-planbox .gsd-c-pr > span:last-child { text-align: right; color: var(--ink); }
.gsd-c-planbox .gsd-c-pr > span .gsd-off { color: #9aa7b8; }
.gsd-c-side { flex: 0 0 74px; text-align: center; padding-top: 4px; }
.gsd-c-side .gsd-c-piggy { font-size: 2.1rem; line-height: 1; }
.gsd-c-side b { display: block; font-size: .76rem; color: var(--navy); font-weight: 600; margin-top: 3px; line-height: 1.25; }
.gsd-c-side small { font-size: .62rem; color: var(--muted); }
.gsd-c-src { text-align: center; font-size: .68rem; color: var(--muted); margin-top: 11px; }
.gsd-c-contact {
    margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line);
    display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: .68rem; color: var(--navy);
}
.gsd-c-after { margin-top: 12px; }
</style>
</head>
<body>

<div class="gsd-shellbar">
    <div class="gsd-group" id="gsdVariants">
        <button data-v="A" class="gsd-on"><b>A</b> ประกาศ</button>
        <button data-v="B"><b>B</b> คำนวณก่อน</button>
        <button data-v="C"><b>C</b> การ์ดประกาศ</button>
    </div>
    <div class="gsd-group">
        <label for="gsdSim">จำลองข้อมูล</label>
        <select id="gsdSim">
            <option value="auto">อัตโนมัติ (ข้อมูลล่าสุดจาก API)</option>
            <option value="carried">จันทร์ — ยังใช้ราคาวันศุกร์</option>
            <option value="saved">จันทร์ — บันทึกราคาใหม่แล้ว</option>
            <option value="weekend">เสาร์–อาทิตย์ — ใช้ราคาวันศุกร์</option>
            <option value="missing">ยังไม่เคยมีราคาบันทึก</option>
        </select>
    </div>
    <div class="gsd-group">
        <button id="gsdWidth">เต็มความกว้าง</button>
    </div>
</div>

<div class="gsd-stage">
    <div class="gsd-frame" id="gsdFrame"><div class="gsd" id="gsdMount"></div></div>
    <p class="gsd-caption" id="gsdCaption">กำลังโหลดข้อมูลจาก api-price.ausiris.co.th …</p>
    <details class="gsd-debug">
        <summary>ข้อมูลดิบที่ component ใช้ตัดสินใจ (context + monthly)</summary>
        <pre id="gsdRaw">—</pre>
    </details>
</div>

<script>
(function () {
    'use strict';

    /* ================= config ================= */
    var API_HOST = 'https://api-price.ausiris.co.th';
    var CTX_URL = API_HOST + '/api/v1/gold-saving';
    var MONTHLY_URL = API_HOST + '/api/v1/gold-saving/monthly';
    var FIXED_PRICE_TIME = '17:00';    // เวลาของราคาที่แสดง ตายตัวตามกติกาธุรกิจ
    var PRESETS = [1000, 2000, 5000, 10000];

    /* ===== snapshot จริงจาก API (18 ก.ย. 2569) ใช้เมื่อเน็ตไม่ถึง ===== */
    var SNAP_CTX = {
        requested_date: '2026-09-18', reference_buyback_price: 67900, reference_selling_price: 68100,
        reference_time: '2026-09-18 08:31:20', purchase_status: 'waiting_close_price',
        is_purchase_day: true, latest_price_is_carried_forward: true,
        unit: 'THB/1 Bath Gold', purity: '96.5%', entry: null,
        latest_price: { price_date: '2026-09-17', buyback_price: 67900, selling_price: 68100 }
    };
    var SNAP_MONTHLY = {
        month: '2026-09', eligible_purchase_days: 22, purchased_days: 2, pending_days: 9, missing_days: 11,
        monthly_amount: 3000, initial_daily_amount: 136.36, invested_amount: 272.72,
        total_gold_baht: 0.00400176, average_cost_per_baht: 68149.96, current_buyback_value: 271.72
    };

    var TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    var TH_MONTH_ABBR = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                         'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    var TH_DAY = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

    /* ================= helpers ================= */
    function thDate(iso) {
        if (!iso) return '—';
        var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
        return 'วัน' + TH_DAY[d.getUTCDay()] + ' ที่ ' + (+p[2]) + ' ' + TH_MONTH[+p[1] - 1] + ' ' + (+p[0] + 543);
    }
    function thDateShort(iso) {
        if (!iso) return '—';
        var p = iso.split('-');
        return (+p[2]) + ' ' + TH_MONTH_ABBR[+p[1] - 1] + ' ' + ((+p[0] + 543) % 100);
    }
    function thDayShort(iso) {
        if (!iso) return '—';
        var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
        return TH_DAY[d.getUTCDay()] + ' ' + thDateShort(iso);
    }
    function thMonthYear(month) {
        var p = (month || '').split('-');
        return TH_MONTH[(+p[1] || 1) - 1] + ' ' + (+p[0] + 543);
    }
    function money(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }
    function num2(n) { return n == null ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function gold(n) { return n == null ? '—' : Number(n).toFixed(6); }
    function round(v, p) { var m = Math.pow(10, p); return Math.round(v * m) / m; }
    function weekdaysIn(month) {
        var p = (month || '').split('-'), y = +p[0], m = +p[1], n = 0;
        var d = new Date(Date.UTC(y, m - 1, 1));
        while (d.getUTCMonth() === m - 1) {
            var w = d.getUTCDay();
            if (w !== 0 && w !== 6) n++;
            d.setUTCDate(d.getUTCDate() + 1);
        }
        return n;
    }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function parseAmount(value) {
        var digits = String(value == null ? '' : value).replace(/[^0-9]/g, '');
        var amount = parseInt(digits, 10);
        return isNaN(amount) ? 0 : Math.min(amount, 10000000);
    }
    function amountInput(id, label) {
        return '<input id="' + id + '" type="text" inputmode="numeric" autocomplete="off" maxlength="10"' +
            ' aria-label="' + esc(label) + '" value="' + money(state.amount) + '">';
    }

    /* ================= state ================= */
    var state = {
        variant: 'A', sim: 'auto', amount: 3000, wide: false,
        ctx: null, monthly: null, live: false
    };

    /* ===== ตัวจำลองสถานะ (เฉพาะ mock — ของจริงอ่านจาก API ตรง ๆ) ===== */
    function simulate() {
        var base = state.ctx || SNAP_CTX;
        var clone = JSON.parse(JSON.stringify(base));

        if (state.sim === 'auto') return { ctx: clone };

        // ศุกร์ 18 ก.ย. มีราคาบันทึกแล้ว; จันทร์ 21 ก.ย. ใช้ราคานี้ต่อจนมี record ใหม่
        var friday = '2026-09-18', saturday = '2026-09-19', monday = '2026-09-21';
        clone.requested_date = monday;
        clone.is_purchase_day = true;
        clone.entry = null;
        clone.latest_price = { price_date: friday, buyback_price: 67800, selling_price: 68000 };
        clone.effective_price = clone.latest_price;
        clone.latest_price_is_carried_forward = true;

        if (state.sim === 'saved') {
            clone.purchase_status = 'purchased';
            clone.entry = { price_date: monday, buyback_price: 68200, selling_price: 68400 };
            clone.latest_price = clone.entry;
            clone.effective_price = clone.entry;
            clone.latest_price_is_carried_forward = false;
            return { ctx: clone };
        }
        if (state.sim === 'missing') {
            clone.purchase_status = 'missing';
            clone.latest_price = null;
            clone.effective_price = null;
            return { ctx: clone };
        }
        if (state.sim === 'weekend') {
            clone.requested_date = saturday;
            clone.is_purchase_day = false;
            clone.purchase_status = 'weekend';
        } else {
            clone.purchase_status = 'waiting_close_price';
        }
        return { ctx: clone };
    }

    /* =====================================================================
       กติกาเลือกราคา — จุดสำคัญของงานนี้
       saved    = มีราคาของวันที่ขอ → ใช้ราคาที่บันทึกแล้ว
       carried  = ยังไม่มีราคาของวันที่ขอ → ใช้ราคาบันทึกล่าสุดต่อไป
       weekend  = เสาร์–อาทิตย์ → ใช้ราคาบันทึกของวันศุกร์
       missing  = ยังไม่เคยมีราคาบันทึก → ไม่ใช้ reference_* หรือราคา realtime
       ===================================================================== */
    var MODES = {
        saved: {
            tone: 'ok', chip: 'ใช้ราคาที่บันทึกแล้ว',
            note: 'ราคานี้เป็นราคาปิดที่บันทึกไว้สำหรับวันดังกล่าว',
            priceCap: 'ราคาบันทึก 17:00', goldLabel: 'ทองที่ได้ต่อวัน'
        },
        carried: {
            tone: 'warn', chip: 'ใช้ราคาปิดวันทำการล่าสุด',
            note: 'ยังไม่มีราคาบันทึกของวันใหม่ ระบบจึงคงราคาล่าสุดไว้จนกว่า API จะมีรายการใหม่',
            priceCap: 'ราคาล่าสุด 17:00', goldLabel: 'ทองที่ได้ต่อวัน'
        },
        missing: {
            tone: 'bad', chip: 'ยังไม่มีราคาที่บันทึก',
            note: 'API ยังไม่มีรายการราคาปิดที่บันทึกไว้ จึงไม่แสดงราคา realtime แทน',
            priceCap: 'ยังไม่มีราคา', goldLabel: 'ยังคำนวณไม่ได้'
        },
        weekend: {
            tone: 'muted', chip: 'เสาร์–อาทิตย์ ใช้ราคาวันศุกร์',
            note: 'คงราคาปิดวันศุกร์ไว้จนกว่าจะมีราคาบันทึกของวันจันทร์จาก API',
            priceCap: 'ราคาวันศุกร์ 17:00', goldLabel: 'ทองที่ได้ต่อวัน'
        }
    };

    function resolve(ctx) {
        // effective_price คือ contract ใหม่ของ backend; latest_price รองรับ API เวอร์ชันเดิม
        var price = ctx.effective_price || ctx.entry || ctx.latest_price || null;
        var isCurrentDate = !!price && price.price_date === ctx.requested_date;
        var mode = !price ? 'missing' : !ctx.is_purchase_day ? 'weekend' : isCurrentDate ? 'saved' : 'carried';

        var cfg = MODES[mode];
        return {
            mode: mode, cfg: cfg, price: price, isCarried: !!price && !isCurrentDate,
            fixedTime: ctx.effective_price_time || FIXED_PRICE_TIME,
            priceDate: price ? price.price_date : null,
            selling: price ? price.selling_price : null,
            buyback: price ? price.buyback_price : null
        };
    }

    /* ================= คำนวณแผนออม (ตรงกับสูตรฝั่ง Rust) ================= */
    function plan(amount, selling, days) {
        if (!amount || !days) return null;
        var daily = Math.floor(amount * 100 / days) / 100;
        return {
            amount: amount, days: days, daily: daily,
            goldPerDay: selling ? round(daily / selling, 6) : null,
            goldMonth: selling ? round(amount / selling, 6) : null
        };
    }

    function model() {
        var sim = simulate();
        var ctx = sim.ctx;
        var month = (ctx.requested_date || '').slice(0, 7);
        var m = state.monthly;
        var days = (m && m.eligible_purchase_days) || weekdaysIn(month);
        var view = resolve(ctx);
        var usable = view.selling;
        offLabel = 'ยังไม่มีราคาบันทึก';
        return {
            ctx: ctx, month: month, days: days, view: view, monthly: m,
            rows: PRESETS.map(function (a) { return plan(a, usable, days); }),
            mine: plan(state.amount, usable, days),
            minePrice: plan(state.amount, view.selling, days)
        };
    }

    /* ================= ชิ้นส่วนที่ใช้ร่วมกัน ================= */
    function statusBar(mo) {
        var v = mo.view;
        var extra = v.priceDate ? 'ราคาที่แสดง = ' + thDateShort(v.priceDate) + ' เวลา ' + esc(v.fixedTime) + ' น.' : '';
        return '<div class="gsd-status gsd-t-' + v.cfg.tone + '">' +
            '<i class="gsd-dot"></i><div><b>' + v.cfg.chip + '</b>' + v.cfg.note +
            (extra ? '<br><span style="opacity:.8">' + extra + '</span>' : '') +
            '</div></div>';
    }

    // ข้อความแทนตัวเลขทอง เมื่อยังไม่มีราคาที่ใช้ซื้อได้จริง
    var offLabel = 'รอราคาปิด';
    function goldCell(g, off) {
        if (g == null) return '<span class="gsd-off">' + (off || offLabel) + '</span>';
        return '<span class="gsd-g gsd-num">' + gold(g) + '</span>';
    }
    /* วันที่ใหญ่ = วันที่ของ record ราคาที่กำลังแสดง ไม่ใช้วันที่/เวลา realtime */
    function dateLines(mo) {
        var v = mo.view, today = mo.ctx.requested_date;
        if (!v.priceDate) return { main: thDate(today), sub: 'ยังไม่มีราคาที่บันทึกในระบบ' };
        if (!v.isCarried) return { main: thDate(v.priceDate), sub: '' };
        return {
            main: thDate(v.priceDate),
            sub: 'วันนี้ ' + thDayShort(today) +
                (v.mode === 'weekend' ? ' · ใช้ราคาวันศุกร์' : ' · รอราคาบันทึกของวันใหม่')
        };
    }

    /* ===================== VARIANT A ===================== */
    function renderA(mo) {
        var v = mo.view;
        var rows = mo.rows.map(function (r, i) {
            var base = plan(PRESETS[i], null, mo.days);
            return '<tr>' +
                '<td>' + money(PRESETS[i]) + '<span class="gsd-sub">บาท/เดือน</span></td>' +
                '<td class="gsd-num">' + num2(base.daily) + '</td>' +
                '<td>' + goldCell(r.goldPerDay, '—') + '</td>' +
                '<td>' + goldCell(r.goldMonth, '—') + '</td>' +
                '</tr>';
        }).join('');
        var mine = mo.mine || plan(state.amount, null, mo.days);
        var minePrice = mo.minePrice || mine;
        var userRow = '<tr class="gsd-user-row" data-user-plan>' +
            '<td><span class="gsd-you">ยอดของคุณ</span><span class="gsd-num" data-user-amount>' + money(state.amount) + '</span><span class="gsd-sub">บาท/เดือน</span></td>' +
            '<td class="gsd-num" data-user-daily>' + num2(minePrice ? minePrice.daily : null) + '</td>' +
            '<td data-user-gold-day>' + goldCell(mine ? mine.goldPerDay : null, '—') + '</td>' +
            '<td data-user-gold-month>' + goldCell(mine ? mine.goldMonth : null, '—') + '</td>' +
            '</tr>';
        var dl = dateLines(mo);
        var headTime = v.priceDate
            ? 'ณ เวลา <span class="gsd-a-at">' + esc(v.fixedTime) + ' น.</span>'
            : '<span class="gsd-a-at">ยังไม่มีราคาที่บันทึก</span>';

        return statusBar(mo) +
        '<div class="gsd-a-head">' +
            '<h2>ประกาศราคาทองคำ สำหรับลูกค้าออมทองออสสิริส<br>' + headTime + '</h2>' +
            '<p>' + dl.main + (dl.sub ? '<span class="gsd-today">' + dl.sub + '</span>' : '') + '</p>' +
        '</div>' +
        '<div class="gsd-pair">' +
            '<div class="gsd-pcard gsd-buy"><div class="gsd-pcard-cap">ซื้อคืน <small>บาทละ</small></div>' +
                '<div class="gsd-pcard-body"><span class="gsd-pcard-val gsd-num">' + money(v.buyback) + '</span><span class="gsd-pcard-unit">บาท</span></div></div>' +
            '<div class="gsd-pcard gsd-sell"><div class="gsd-pcard-cap">ขายออก <small>บาทละ</small></div>' +
                '<div class="gsd-pcard-body"><span class="gsd-pcard-val gsd-num">' + money(v.selling) + '</span><span class="gsd-pcard-unit">บาท</span></div></div>' +
        '</div>' +
        '<div class="gsd-table"><table>' +
            '<thead><tr><th>ออมเดือนละ</th><th>ซื้อทอง<br>วันละ (บาท)</th><th>ทองที่ได้<br>ต่อวัน</th><th>ทองที่ได้<br>ทั้งเดือน</th></tr></thead>' +
            '<tbody>' + rows + userRow + '</tbody>' +
        '</table></div>' +
        '<p class="gsd-foot-note">หมายเหตุ : เดือน' + thMonthYear(mo.month) + ' เฉลี่ยซื้อทอง ' + mo.days + ' วันทำการ' +
            '<br>คำนวณจากราคาปิดที่บันทึกล่าสุด ณ เวลา 17:00 น.</p>' +
        '<div class="gsd-custom">' +
            '<h3>สำหรับลูกค้าที่ออมทองตามยอดที่กำหนดเอง</h3>' +
            '<div class="gsd-inputrow"><span>กรอกยอดออมของคุณ</span>' +
                amountInput('gsdAmtA', 'ยอดออมของคุณ') + '<em>บาท/เดือน</em></div>' +
            '<div class="gsd-chips" data-chips>' + PRESETS.map(function (a) {
                return '<button data-amt="' + a + '"' + (state.amount === a ? ' class="gsd-on"' : '') + '>' + money(a) + '</button>';
            }).join('') + '</div>' +
            '<p class="gsd-custom-help">ผลคำนวณแสดงในแถว “ยอดของคุณ” ในตารางด้านบน · ' + mo.days + ' วันทำการ</p>' +
        '</div>';
    }

    /* ===================== VARIANT B ===================== */
    function renderB(mo) {
        var v = mo.view, m = mo.monthly;
        var done = m ? m.purchased_days : 0, miss = m ? m.missing_days : 0;
        var pct = function (n) { return mo.days ? (n / mo.days * 100) : 0; };

        var presetRows = mo.rows.map(function (r, i) {
            var base = plan(PRESETS[i], null, mo.days);
            return '<tr><td>' + money(PRESETS[i]) + '</td><td class="gsd-num">' + num2(base.daily) + '</td><td>' + goldCell(r.goldMonth, '—') + '</td></tr>';
        }).join('');

        return statusBar(mo) +
        '<div class="gsd-b-hero">' +
            '<div class="gsd-b-kicker">ออมทองออสสิริส · ' + dateLines(mo).main +
                (dateLines(mo).sub ? ' <span style="opacity:.75">(' + dateLines(mo).sub + ')</span>' : '') + '</div>' +
            '<h2>คุณออมเดือนละเท่าไหร่?</h2>' +
            '<div class="gsd-b-inputwrap"><label>ยอดออม</label>' +
                amountInput('gsdAmtB', 'ยอดออม') + '<em>บาท/เดือน</em></div>' +
            '<div class="gsd-b-chips" data-chips>' + PRESETS.map(function (a) {
                return '<button data-amt="' + a + '"' + (state.amount === a ? ' class="gsd-on"' : '') + '>' + money(a) + '</button>';
            }).join('') + '</div>' +
        '</div>' +
        '<div class="gsd-b-result">' +
            '<div class="gsd-b-rlabel">' + v.cfg.goldLabel + '</div>' +
            '<div class="gsd-b-big' + (mo.mine && mo.mine.goldPerDay != null ? '' : ' gsd-off') + ' gsd-num">' +
                (mo.mine && mo.mine.goldPerDay != null ? gold(mo.mine.goldPerDay) : '— . — — —') +
                '<small>บาททอง</small></div>' +
            '<dl class="gsd-b-split">' +
                '<div><dt>ซื้อทองวันละ</dt><dd class="gsd-num">' + num2(mo.minePrice ? mo.minePrice.daily : null) + ' บาท</dd></div>' +
                '<div><dt>ทองที่ได้ทั้งเดือน</dt><dd>' + goldCell(mo.mine ? mo.mine.goldMonth : null) + '</dd></div>' +
            '</dl>' +
        '</div>' +
        '<div class="gsd-b-month">' +
            '<h3>เดือน' + thMonthYear(mo.month) + '<span>' + done + '/' + mo.days + ' วันทำการ</span></h3>' +
            '<div class="gsd-bar"><i class="gsd-bar-done" style="width:' + pct(done) + '%"></i><i class="gsd-bar-miss" style="width:' + pct(miss) + '%"></i></div>' +
            '<div class="gsd-b-legend">' +
                '<span><i style="background:#00924c"></i>ซื้อแล้ว ' + done + ' วัน</span>' +
                '<span><i style="background:#f3c2cc"></i>ไม่มีราคาปิด ' + miss + ' วัน</span>' +
                '<span><i style="background:#eef1f6"></i>รออีก ' + Math.max(0, mo.days - done - miss) + ' วัน</span>' +
            '</div>' +
            '<div class="gsd-b-rows">' +
                '<div><span>ทองสะสมจริงเดือนนี้</span><b class="gsd-num">' + (m ? gold(m.total_gold_baht) : '—') + ' บาททอง</b></div>' +
                '<div><span>เงินที่ลงไปแล้ว</span><b class="gsd-num">' + (m ? num2(m.invested_amount) : '—') + ' บาท</b></div>' +
                '<div><span>ต้นทุนเฉลี่ย/บาททอง</span><b class="gsd-num">' + (m && m.average_cost_per_baht ? money(Math.round(m.average_cost_per_baht)) : '—') + ' บาท</b></div>' +
                '<div><span>มูลค่าตามราคาซื้อคืน</span><b class="gsd-num">' + (m && m.current_buyback_value != null ? num2(m.current_buyback_value) : '—') + ' บาท</b></div>' +
            '</div>' +
        '</div>' +
        '<dl class="gsd-b-prices">' +
            '<div class="gsd-b-price gsd-buy"><dt>ซื้อคืน · ' + v.cfg.priceCap + '</dt><dd class="gsd-num">' + money(v.buyback) + '</dd></div>' +
            '<div class="gsd-b-price gsd-sell"><dt>ขายออก · ' + v.cfg.priceCap + '</dt><dd class="gsd-num">' + money(v.selling) + '</dd></div>' +
        '</dl>' +
        '<details class="gsd-acc"><summary>แผนมาตรฐาน 1,000 – 10,000 บาท</summary>' +
            '<div class="gsd-acc-body gsd-table"><table>' +
                '<thead><tr><th>ออมเดือนละ</th><th>วันละ (บาท)</th><th>ทองทั้งเดือน</th></tr></thead>' +
                '<tbody>' + presetRows + '</tbody></table></div>' +
        '</details>';
    }

    /* ===================== VARIANT C ===================== */
    function renderC(mo) {
        var v = mo.view;
        var planRows = mo.rows.map(function (r, i) {
            return '<div class="gsd-c-pr"><span>' + money(PRESETS[i]) + ' บาท</span>' +
                '<span>' + (r.goldMonth != null ? '<b class="gsd-num">' + gold(r.goldMonth) + '</b> บาท' : '<span class="gsd-off">' + offLabel + '</span>') + '</span></div>';
        }).join('');
        var dl = dateLines(mo);
        var dateLine = dl.main +
            (v.priceDate ? ' เวลา ' + esc(v.fixedTime) + ' น.' : '') +
            (dl.sub ? '<br>' + dl.sub : '');

        return '<div class="gsd-c-card"><div class="gsd-c-inner">' +
            '<div class="gsd-c-top">' +
                '<div><h2 class="gsd-c-title">ราคา<em>ทอง</em>คำ</h2>' +
                    '<div class="gsd-c-date">' + dateLine + '</div></div>' +
                '<div class="gsd-c-brand"><b>AUSIRIS</b><small>GOLD SAVING</small></div>' +
            '</div>' +
            '<div class="gsd-c-tiles">' +
                '<div class="gsd-c-tile gsd-buy"><div class="gsd-c-cap">ซื้อคืน <small>บาทละ</small></div><div class="gsd-c-val gsd-num">' + money(v.buyback) + '</div></div>' +
                '<div class="gsd-c-tile gsd-sell"><div class="gsd-c-cap">ขายออก <small>บาทละ</small></div><div class="gsd-c-val gsd-num">' + money(v.selling) + '</div></div>' +
            '</div>' +
            '<div class="gsd-c-plan">' +
                '<div class="gsd-c-planbox"><div class="gsd-c-ph"><b>ออมเดือนละ</b><b>ซื้อทองได้</b></div>' + planRows + '</div>' +
                '<div class="gsd-c-side"><div class="gsd-c-piggy">🐷</div><b>สำหรับออมทอง</b><small>ออสสิริส</small></div>' +
            '</div>' +
            '<div class="gsd-c-src">ราคาทองอิงตามประกาศของสมาคมค้าทองคำ · ทอง 96.5%</div>' +
            '<div class="gsd-c-contact"><span>0-2613-4702-3</span><span>ausiris.co.th</span><span>@goldsaving</span></div>' +
        '</div></div>' +
        '<div class="gsd-c-after">' + statusBar(mo) +
            '<details class="gsd-acc"><summary>คำนวณยอดออมของคุณเอง</summary>' +
                '<div class="gsd-acc-body" style="padding:12px">' +
                    '<div class="gsd-inputrow"><span>ยอดออมของคุณ</span>' +
                        amountInput('gsdAmtC', 'ยอดออมของคุณ') + '<em>บาท/เดือน</em></div>' +
                    '<div class="gsd-chips" data-chips>' + PRESETS.map(function (a) {
                        return '<button data-amt="' + a + '"' + (state.amount === a ? ' class="gsd-on"' : '') + '>' + money(a) + '</button>';
                    }).join('') + '</div>' +
                    '<dl class="gsd-statgrid">' +
                        '<div><dt>จำนวนวันทำการ</dt><dd class="gsd-num">' + mo.days + '<small>วัน</small></dd></div>' +
                        '<div><dt>ซื้อทองวันละ</dt><dd class="gsd-num">' + num2(mo.minePrice ? mo.minePrice.daily : null) + '<small>บาท</small></dd></div>' +
                        '<div><dt>ทองที่ได้ต่อวัน</dt><dd>' + goldCell(mo.mine ? mo.mine.goldPerDay : null) + '</dd></div>' +
                        '<div><dt>ทองที่ได้ทั้งเดือน</dt><dd>' + goldCell(mo.mine ? mo.mine.goldMonth : null) + '</dd></div>' +
                    '</dl>' +
                '</div>' +
            '</details>' +
        '</div>';
    }

    /* ================= render + events ================= */
    var mount = document.getElementById('gsdMount');
    var frame = document.getElementById('gsdFrame');
    var caption = document.getElementById('gsdCaption');
    var raw = document.getElementById('gsdRaw');

    function render() {
        var mo = model();
        mount.innerHTML = state.variant === 'A' ? renderA(mo) : state.variant === 'B' ? renderB(mo) : renderC(mo);
        bindAmount();
        var v = mo.view;
        var resolvedText = v.priceDate
            ? 'ราคาที่ใช้คำนวณ = ' + money(v.selling) + ' ของวันที่ ' + thDateShort(v.priceDate) + ' เวลา ' + esc(v.fixedTime) + ' น.'
            : 'ยังไม่มีราคาบันทึกสำหรับใช้คำนวณ';
        caption.innerHTML = (state.live ? '● ข้อมูลราคาที่บันทึกจาก api-price.ausiris.co.th' : '○ ใช้ snapshot ในไฟล์ (เรียก API ไม่ได้)') +
            ' · สถานะที่ระบบตัดสินใจ: <b>' + v.mode + '</b> (API purchase_status = ' + esc(mo.ctx.purchase_status) + ')' +
            ' · ' + resolvedText + ' · ไม่ใช้ reference realtime';
        raw.textContent = JSON.stringify({ context: mo.ctx, monthly: mo.monthly, resolved: { mode: v.mode, selling: v.selling, price_date: v.priceDate, price_time: v.fixedTime, is_carried_forward: v.isCarried } }, null, 2);
    }

    function bindAmount() {
        var input = mount.querySelector('#gsdAmtA, #gsdAmtB, #gsdAmtC');
        if (input) {
            input.addEventListener('input', function () {
                state.amount = parseAmount(input.value);
                input.value = state.amount ? money(state.amount) : '';
                syncAmountUI();
                fetchMonthly();
            });
            input.addEventListener('blur', function () {
                if (state.amount < 1) state.amount = 1;
                input.value = money(state.amount);
                syncAmountUI();
            });
        }
        var chips = mount.querySelector('[data-chips]');
        if (chips) {
            chips.addEventListener('click', function (e) {
                var btn = e.target.closest('button[data-amt]');
                if (!btn) return;
                state.amount = parseInt(btn.getAttribute('data-amt'), 10);
                render();
                fetchMonthly();
            });
        }
    }

    // อัปเดตเฉพาะตัวเลขที่ผูกกับยอด ไม่ re-render ทั้งก้อน เพื่อไม่ให้ input เสีย focus
    function syncAmountUI() {
        var mo = model();
        var grid = mount.querySelectorAll('.gsd-statgrid dd');
        if (grid.length === 4) {
            grid[1].innerHTML = num2(mo.minePrice ? mo.minePrice.daily : null) + '<small>บาท</small>';
            grid[2].innerHTML = goldCell(mo.mine ? mo.mine.goldPerDay : null);
            grid[3].innerHTML = goldCell(mo.mine ? mo.mine.goldMonth : null);
        }
        var big = mount.querySelector('.gsd-b-big');
        if (big) {
            big.className = 'gsd-b-big' + (mo.mine && mo.mine.goldPerDay != null ? '' : ' gsd-off') + ' gsd-num';
            big.innerHTML = (mo.mine && mo.mine.goldPerDay != null ? gold(mo.mine.goldPerDay) : '— . — — —') + '<small>บาททอง</small>';
        }
        var split = mount.querySelectorAll('.gsd-b-split dd');
        if (split.length === 2) {
            split[0].innerHTML = num2(mo.minePrice ? mo.minePrice.daily : null) + ' บาท';
            split[1].innerHTML = goldCell(mo.mine ? mo.mine.goldMonth : null);
        }
        var userRow = mount.querySelector('[data-user-plan]');
        if (userRow) {
            userRow.querySelector('[data-user-amount]').textContent = money(state.amount);
            userRow.querySelector('[data-user-daily]').textContent = num2(mo.minePrice ? mo.minePrice.daily : null);
            userRow.querySelector('[data-user-gold-day]').innerHTML = goldCell(mo.mine ? mo.mine.goldPerDay : null, '—');
            userRow.querySelector('[data-user-gold-month]').innerHTML = goldCell(mo.mine ? mo.mine.goldMonth : null, '—');
        }
        var chips = mount.querySelectorAll('[data-chips] button');
        Array.prototype.forEach.call(chips, function (b) {
            b.classList.toggle('gsd-on', parseInt(b.getAttribute('data-amt'), 10) === state.amount);
        });
    }

    document.getElementById('gsdVariants').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-v]');
        if (!btn) return;
        state.variant = btn.getAttribute('data-v');
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) { b.classList.remove('gsd-on'); });
        btn.classList.add('gsd-on');
        render();
    });
    document.getElementById('gsdSim').addEventListener('change', function () {
        state.sim = this.value;
        render();
    });
    document.getElementById('gsdWidth').addEventListener('click', function () {
        state.wide = !state.wide;
        frame.classList.toggle('gsd-wide', state.wide);
        this.textContent = state.wide ? 'มือถือ 390px' : 'เต็มความกว้าง';
        this.classList.toggle('gsd-on', state.wide);
    });

    /* ================= data ================= */
    var monthlyTimer = null;
    function fetchMonthly() {
        clearTimeout(monthlyTimer);
        monthlyTimer = setTimeout(function () {
            var amt = state.amount > 0 ? state.amount : 1000;
            fetch(MONTHLY_URL + '?amount=' + amt, { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (j) { if (j) { state.monthly = j; render(); } })
                .catch(function () {});
        }, 400);
    }

    function boot() {
        state.ctx = SNAP_CTX;
        state.monthly = SNAP_MONTHLY;
        render();
        Promise.all([
            fetch(CTX_URL, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }),
            fetch(MONTHLY_URL + '?amount=' + state.amount, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
        ]).then(function (res) {
            if (res[0]) { state.ctx = res[0]; state.live = true; }
            if (res[1]) { state.monthly = res[1]; }
            render();
        }).catch(function () { render(); });
    }

    boot();
    setInterval(function () { if (state.sim === 'auto') boot(); }, 60000);
})();
</script>
</body>
</html>
